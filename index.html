<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ドンピシャ！ビートパレード</title>
<link rel="stylesheet" href="css/style.css?v=20260906t">
</head>
<body>
<main id="app">

  <section id="scr-title" class="screen active">
    <div class="title-box">
      <div class="logo-stars">⭐ 🌟 ⭐</div>
      <h1>ドンピシャ！ビートパレード</h1>
      <p class="tag">ノリを かんじて、ジャストで おす リズムゲーム！</p>
      <button id="btn-start" class="big-btn">🎵 スタート！</button>
      <p class="hint">スペースキー / アローキー / クリック / タップ で あそべるよ（おとが でます 🔊）</p>
    </div>
  </section>

  <section id="scr-select" class="screen">
    <header id="sel-head">
      <h2 id="side-title">☀ おもて ステージ</h2>
      <div class="head-right">
        <span id="medal-count" title="ハイレベルの数">⭐ 0</span>
        <button id="btn-side" class="side-btn">🔒 うら</button>
        <button id="btn-ver" class="side-btn" title="ゲームのバージョンを きりかえ（初期バージョン ⇄ Ver. 1）">📼 Ver. 1</button>
        <button id="btn-wipe" title="セーブデータをけす">🗑</button>
      </div>
    </header>
    <div id="mode-bar">
      <button class="mode-btn active" data-mode="solo">🎮 1人</button>
      <button class="mode-btn" data-mode="coop">🤝 ふたり協力</button>
      <button class="mode-btn" data-mode="versus">⚔ ふたり対戦</button>
      <button id="btn-lane" class="lane-btn" title="したのタイミングレーンの ひょうじ切替（ゲームちゅうは Lキー）">🎯 レーン: ON</button>
      <button id="btn-arrow" class="lane-btn" title="アロー版: アローゲーム以外の ぜんぶの ゲームの ノーツに ↑↓←→ を つける">🎮 アロー版: OFF</button>
      <button id="btn-arrowmix" class="lane-btn" title="アロー＆通常版: ノーツの いちぶ(だいたい半分)に ↑↓←→ が つき、のこりは ふつうノーツ">🎮 アロー＆通常版: OFF</button>
      <button id="btn-kbd" class="lane-btn" title="キーボード版: ノーツに A〜Z・0〜9 のキーがつく。アローキーは レーンの ON/OFF">⌨️ キーボード版: OFF</button>
      <button id="btn-kbdmix" class="lane-btn" title="キーボード＆通常版: ノーツの いちぶ(だいたい半分)に A〜Z・0〜9 のキーが つき、のこりは ふつうノーツ(どのキーでも OK)">⌨️ キーボード＆通常版: OFF</button>
      <button id="btn-arrowkbd" class="lane-btn" title="アロー＆キーボード版: ぜんぶの ノーツに ↑↓←→ か A〜Z・0〜9 の どちらかが つく。レーンの ON/OFF は Lキー">🎮⌨️ アロー＆キーボード版: OFF</button>
      <button id="btn-arrowkbdmix" class="lane-btn" title="アロー＆キーボード＆通常版: ノーツに ↑↓←→ か A〜Z・0〜9 が ついたり つかなかったり。レーンの ON/OFF は Lキー">🎮⌨️ アロー＆キーボード＆通常版: OFF</button>
      <button id="btn-kbdonly" class="lane-btn" title="キーボード専用版: アローゲームも ふくめて ぜんぶの ノーツが A〜Z・0〜9 のキーになる。スペース・タップは つかえない。アローキーは レーンの ON/OFF">⌨️ キーボード専用版: OFF</button>
      <button id="btn-night" class="lane-btn night-btn" title="ナイトモード" hidden>🌙 ナイト: OFF</button>
      <span id="speed-ctl" class="speed-ctl" title="はやさ: 0.5×〜10×(0.5きざみ)。ゲーム中は Esc の ストップメニューからも かえられる">
        <button id="btn-spd-down" class="lane-btn spd-btn">🐢 −</button>
        <span id="spd-label">⏩ はやさ 1.0×</span>
        <input id="spd-range" type="range" min="0.5" max="10" step="0.5" value="1">
        <button id="btn-spd-up" class="lane-btn spd-btn">＋ 🐇</button>
      </span>
    </div>
    <p id="mode-hint" class="side-hint"></p>
    <p id="side-hint" class="side-hint"></p>
    <div id="stage-list"></div>
  </section>

  <section id="scr-game">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="game-overlay"></div>
  </section>

</main>
<script src="js/audio.js?v=20260906t"></script>
<script src="js/patterns.js?v=20260906t"></script>
<script src="js/data.js?v=20260906t"></script>
<script src="js/engine.js?v=20260906t"></script>
<script src="js/ui.js?v=20260906t"></script>
</body>
</html>
